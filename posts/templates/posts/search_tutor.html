

{% extends "home/base.html" %}
{% load static %}

{% block extra_head %}
    <link rel="stylesheet" href="{% static 'posts/css/search_tutor.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">

    <!-- Update multiple images -->
    <link href="https://unpkg.com/filepond/dist/filepond.css" rel="stylesheet">

{% endblock extra_head %}




{% block main_content %}

<div class="d-flex-col gap-5 h-min p-5">

    {# FORMULARIO CONSULTAR TUTORES #}
    <form class="bg-primary border-hover d-grid cont-grid-122 gap-3 mt-5 form-search-tutor" 
    id="form-search-tutores" method="GET" action="{% url 'materias_lista' %}">
        
        <h1 class="bold-main grid-col-all justify-self-center mb-2">Encuentra a tu Tutor Ideal</h1>
        
        <label class="bolder d-flex-col gap-1 text-start">
            <span>Carrera: </span>
            
            <select name="degree">
                <option value="0">Seleccione una carrera</option>
                {% for degree in degrees %}
                    <option value="{{degree.id}}">
                        {{degree.name}}
                    </option>
                {% endfor %}
            </select>
        </label>


        <label class="bolder d-flex-col gap-1 text-start">
            <span> Materia: <b class=" bold-red">(*)</b></span>
            <select name="subject">
                <option value="0">Seleccione una materia</option>
                {% for subject in subjects %}
                    <option value="{{subject.id}}">
                        {{subject.name}}
                    </option>
                {% endfor %}
            </select>
        </label>


        <label class="bolder d-flex-col gap-1 text-start">
            Universidad:
            <!--- 
            <input type="text" placeholder="Ej: Integrales, Algoritmos, etc.">
            -->
            <select name="university" id="">
                <option value="utn">UTN - FRC</option>
                <option value="unc">UNC</option>
            </select>
        </label>

        <label class="bolder d-flex-col gap-1 text-start">
            Modalidad:
            <select name="modalidad">
                <option value="0">Seleccione una modalidad</option>
                <option value="todas">Todas</option>
                <option value="virtual">Virtual</option>
                <option value="presencial">Presencial</option>
                <option value="hibrido">Híbrido</option>
            </select>
        </label>


        <label class="bolder d-flex-col gap-1 text-start">
            Precio del tutor por hora:
            <div class="relative btn-36 w-100">
                <input type="range" id="min-range" min="0" max="1000" value="200" step="50">
                <input type="range" id="max-range" min="0" max="1000" value="800" step="50">
                <div class="slider-track"> </div>
            </div>
            <div class="bolder font-sm text-secondary d-flex-col-row">
                <div>
                    Mín: $<span id="min-val">200</span> — 
                </div>
                <div>
                    Máx: $<span id="max-val">800</span>
                </div>
            </div>
        </label>


        <div class="grid-col-all d-grid cont-grid-2 gap-2">
            <a href="/" class="btn btn-close w-min px-2 btn-36 bolder justify-self-end">
                Cancelar
            </a>
            <button class="btn btn-main w-min px-2 btn-36 bolder text-truncate">Buscar Tutor</button>
        </div>
    </form>

</div>

{% endblock main_content %}





{% block extra_scripts %}
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

     <script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script> 

    <!-- Scripts accept multiple files images from mobile   -->
    <script src="https://unpkg.com/filepond/dist/filepond.js"></script> 

    <script src="{% static 'posts/js/search_tutor.js' %}"></script>

{% endblock extra_scripts %}
